name: Build PDF

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live (with ctex + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended fonts-noto-cjk lmodern

      - name: Compile (two passes)
        run: |
          xelatex -interaction=nonstopmode -halt-on-error 把经历变成证据-初稿.tex
          xelatex -interaction=nonstopmode -halt-on-error 把经历变成证据-初稿.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: 把经历变成证据-初稿.pdf
          if-no-files-found: error
