<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">从问题到证据的链条</title><desc id="d">一个职业判断需要从真实问题经过行动、结果、证据和复盘，才能支持下一次选择。</desc><style>
  .title{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:34px;font-weight:700;fill:#20354D}
  .subtitle{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:18px;fill:#52677D}
  .h{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:24px;font-weight:700;fill:#20354D}
  .body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:19px;fill:#20354D}
  .small{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:16px;fill:#52677D}
  .white{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:20px;font-weight:700;fill:#FFFFFF}
  .line{stroke:#B9C8D6;stroke-width:3;fill:none}
</style>
<rect width="1200" height="680" rx="28" fill="#F7FAFC"/>
<text x="70" y="72" class="title">把学习变成证据</text><text x="70" y="108" class="subtitle">“我学过”只是输入；能解释问题、责任、结果和边界，才是可迁移的证据。</text>
<g transform="translate(72,210)">
  <rect x="0" y="0" width="180" height="190" rx="20" fill="#EAF1F7" stroke="#B9C8D6" stroke-width="2"/><text x="90" y="45" text-anchor="middle" class="h">问题</text><text x="22" y="90" class="body">谁遇到了什么</text><text x="22" y="125" class="body">痛点？约束是</text><text x="22" y="160" class="body">什么？</text>
  <rect x="220" y="0" width="180" height="190" rx="20" fill="#E7F5F3" stroke="#95D2CC" stroke-width="2"/><text x="310" y="45" text-anchor="middle" class="h">行动</text><text x="242" y="90" class="body">我具体负责</text><text x="242" y="125" class="body">哪些模块？</text><text x="242" y="160" class="body">做了哪些取舍？</text>
  <rect x="440" y="0" width="180" height="190" rx="20" fill="#FFF3E7" stroke="#E9B77D" stroke-width="2"/><text x="530" y="45" text-anchor="middle" class="h">结果</text><text x="462" y="90" class="body">系统是否运行？</text><text x="462" y="125" class="body">谁使用？指标</text><text x="462" y="160" class="body">改善了多少？</text>
  <rect x="660" y="0" width="180" height="190" rx="20" fill="#F0EDFA" stroke="#B8AEE0" stroke-width="2"/><text x="750" y="45" text-anchor="middle" class="h">证据</text><text x="682" y="90" class="body">代码、日志、</text><text x="682" y="125" class="body">用户反馈、实验</text><text x="682" y="160" class="body">和交付记录</text>
  <rect x="880" y="0" width="180" height="190" rx="20" fill="#20354D"/><text x="970" y="45" text-anchor="middle" class="white">再选择</text><text x="902" y="90" class="white">继续、收敛、</text><text x="902" y="125" class="white">转向或退出</text><text x="902" y="160" class="white">都要有理由</text>
</g>
<path d="M252 305h32m188 0h32m188 0h32m188 0h32" stroke="#168C86" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M276 289l24 16-24 16M496 289l24 16-24 16M716 289l24 16-24 16M936 289l24 16-24 16" fill="#168C86"/>
<rect x="150" y="490" width="900" height="84" rx="18" fill="#EAF5F5" stroke="#95D2CC" stroke-width="2"/><text x="600" y="525" text-anchor="middle" class="h">一份经历的核心，不是“我接触过什么”，而是“我能否说清楚我对什么负责”</text><text x="600" y="558" text-anchor="middle" class="small">注意：平台品牌、团队成果和个人责任必须分开记录</text>
</svg>
